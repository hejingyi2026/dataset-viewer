<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据集展示系统</title>
<style>
/* SECTION: reset & base */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--bg2:#161822;--bg3:#1e2030;--bg4:#262940;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --accent:#6366f1;--accent2:#818cf8;--accent-bg:rgba(99,102,241,.12);
  --green:#22c55e;--yellow:#eab308;--red:#ef4444;--cyan:#06b6d4;
  --radius:10px;--radius-sm:6px;
  --shadow:0 4px 24px rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
}
html{font-size:15px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
a{color:var(--accent2);text-decoration:none}

/* SECTION: layout */
.app-header{
  position:sticky;top:0;z-index:100;
  background:rgba(15,17,23,.88);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bg4);padding:0 2rem;height:60px;
  display:flex;align-items:center;justify-content:space-between;
}
.app-header h1{font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:.6rem}
.app-header h1 .logo-icon{width:28px;height:28px;background:var(--accent);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#fff}
.header-stats{display:flex;gap:1.5rem;font-size:.82rem;color:var(--text2)}
.header-stats span{display:flex;align-items:center;gap:.35rem}
.header-stats .dot{width:7px;height:7px;border-radius:50%;display:inline-block}

.container{max-width:1280px;margin:0 auto;padding:1.5rem 2rem 3rem}

/* SECTION: search & filters */
.toolbar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-bottom:1.5rem}
.search-box{
  flex:1;min-width:220px;position:relative;
}
.search-box input{
  width:100%;padding:.65rem 1rem .65rem 2.5rem;
  background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);
  color:var(--text);font-size:.9rem;outline:none;transition:border .2s;
}
.search-box input:focus{border-color:var(--accent)}
.search-box input::placeholder{color:var(--text3)}
.search-box .search-icon{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.95rem;pointer-events:none}

.filter-group{display:flex;gap:.4rem;flex-wrap:wrap}
.filter-btn{
  padding:.4rem .85rem;border-radius:20px;border:1px solid var(--bg4);
  background:transparent;color:var(--text2);font-size:.78rem;cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
.filter-btn:hover{border-color:var(--accent);color:var(--text)}
.filter-btn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent2)}

/* SECTION: stats bar */
.stats-bar{display:flex;gap:1.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
.stat-card{
  background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);
  padding:1rem 1.4rem;flex:1;min-width:140px;
}
.stat-card .stat-label{font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.25rem}
.stat-card .stat-value{font-size:1.6rem;font-weight:700;color:var(--text)}
.stat-card .stat-value .unit{font-size:.85rem;font-weight:400;color:var(--text2);margin-left:.2rem}

/* SECTION: dataset grid */
.dataset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem}
.dataset-card{
  background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);
  padding:1.25rem 1.4rem;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;
}
.dataset-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.dataset-card .card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.6rem}
.dataset-card .card-title{font-size:1.05rem;font-weight:600;line-height:1.35;flex:1}
.dataset-card .card-format{
  font-size:.7rem;padding:.2rem .55rem;border-radius:4px;font-weight:600;
  text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;flex-shrink:0;margin-left:.6rem;
}
.fmt-csv{background:rgba(34,197,94,.15);color:var(--green)}
.fmt-json{background:rgba(6,182,212,.15);color:var(--cyan)}
.fmt-parquet{background:rgba(234,179,8,.15);color:var(--yellow)}
.fmt-excel{background:rgba(99,102,241,.15);color:var(--accent2)}
.dataset-card .card-desc{font-size:.82rem;color:var(--text2);margin-bottom:.8rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dataset-card .card-meta{display:flex;gap:1rem;font-size:.75rem;color:var(--text3);margin-bottom:.7rem}
.dataset-card .card-meta span{display:flex;align-items:center;gap:.3rem}
.dataset-card .card-tags{display:flex;gap:.35rem;flex-wrap:wrap}
.tag{font-size:.68rem;padding:.15rem .5rem;background:var(--bg3);border-radius:12px;color:var(--text2)}

/* SECTION: empty state */
.empty-state{text-align:center;padding:4rem 1rem;color:var(--text3)}
.empty-state .empty-icon{font-size:3rem;margin-bottom:1rem;opacity:.5}
.empty-state p{font-size:.95rem}

/* SECTION: detail view */
.detail-view{display:none}
.detail-view.active{display:block}
.list-view.hidden{display:none}

.detail-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
.back-btn{
  display:flex;align-items:center;gap:.4rem;padding:.5rem 1rem;
  background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);
  color:var(--text2);cursor:pointer;font-size:.85rem;transition:all .2s;
}
.back-btn:hover{border-color:var(--accent);color:var(--text)}
.detail-title-area{flex:1}
.detail-title-area h2{font-size:1.35rem;font-weight:700}
.detail-title-area .detail-format{font-size:.72rem;padding:.15rem .5rem;border-radius:4px;font-weight:600;text-transform:uppercase;margin-left:.5rem;vertical-align:middle}
.detail-title-area .detail-desc{font-size:.88rem;color:var(--text2);margin-top:.3rem}
.detail-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}

.detail-body{display:grid;grid-template-columns:1fr;gap:1.25rem}

.detail-section{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:1.25rem 1.4rem}
.detail-section h3{font-size:.95rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.detail-section h3 .section-icon{color:var(--accent2)}

/* SECTION: field table */
.field-table{width:100%;border-collapse:collapse;font-size:.82rem}
.field-table th{text-align:left;padding:.55rem .7rem;color:var(--text3);font-weight:500;border-bottom:1px solid var(--bg4);font-size:.75rem;text-transform:uppercase;letter-spacing:.3px}
.field-table td{padding:.55rem .7rem;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text2)}
.field-table tr:hover td{background:var(--bg3)}
.field-type{font-size:.72rem;padding:.1rem .45rem;border-radius:3px;background:var(--accent-bg);color:var(--accent2)}

/* SECTION: preview table */
.preview-wrap{overflow-x:auto;max-height:380px;overflow-y:auto}
.preview-table{width:100%;border-collapse:collapse;font-size:.78rem;white-space:nowrap}
.preview-table th{position:sticky;top:0;background:var(--bg2);text-align:left;padding:.5rem .6rem;color:var(--text3);font-weight:500;border-bottom:1px solid var(--bg4);font-size:.72rem;z-index:1}
.preview-table td{padding:.45rem .6rem;border-bottom:1px solid rgba(255,255,255,.03);color:var(--text2);max-width:200px;overflow:hidden;text-overflow:ellipsis}
.preview-table tr:hover td{background:rgba(99,102,241,.06)}

/* SECTION: stats summary */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem}
.stats-item{background:var(--bg3);border-radius:var(--radius-sm);padding:.85rem 1rem}
.stats-item .si-label{font-size:.72rem;color:var(--text3);margin-bottom:.2rem}
.stats-item .si-value{font-size:1.15rem;font-weight:600}
.stats-item .si-sub{font-size:.72rem;color:var(--text3);margin-top:.15rem}

/* SECTION: detail meta bar */
.detail-meta{display:flex;gap:1.5rem;flex-wrap:wrap;margin-bottom:1.25rem}
.detail-meta .meta-item{font-size:.82rem;color:var(--text2);display:flex;align-items:center;gap:.4rem}
.detail-meta .meta-item strong{color:var(--text);font-weight:600}

/* SECTION: import button */
.import-btn{
  display:flex;align-items:center;gap:.4rem;padding:.55rem 1rem;
  background:var(--accent);border:none;border-radius:var(--radius);
  color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s;white-space:nowrap;font-weight:500;
}
.import-btn:hover{background:var(--accent2);transform:translateY(-1px)}
.import-btn .import-icon{font-size:1rem}
#import-file-input{display:none}

/* SECTION: notebook viewer */
.nb-viewer{display:flex;flex-direction:column;gap:0}
.nb-cell{border-left:3px solid transparent;padding:.6rem 1rem;position:relative;transition:border-color .2s}
.nb-cell:hover{background:rgba(99,102,241,.04)}
.nb-cell.code-cell{border-left-color:var(--accent)}
.nb-cell.markdown-cell{border-left-color:var(--green)}
.nb-cell.raw-cell{border-left-color:var(--yellow)}
.nb-cell-label{
  font-size:.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:.3rem;display:flex;align-items:center;gap:.5rem;
}
.nb-cell-label .cell-type-badge{
  font-size:.6rem;padding:.1rem .4rem;border-radius:3px;font-weight:600;
}
.nb-cell.code-cell .cell-type-badge{background:var(--accent-bg);color:var(--accent2)}
.nb-cell.markdown-cell .cell-type-badge{background:rgba(34,197,94,.12);color:var(--green)}
.nb-cell.raw-cell .cell-type-badge{background:rgba(234,179,8,.12);color:var(--yellow)}
.nb-cell-label .cell-index{color:var(--text3)}
.nb-code-block{
  background:var(--bg);border:1px solid var(--bg4);border-radius:var(--radius-sm);
  padding:.75rem 1rem;font-family:"Cascadia Code","Fira Code","JetBrains Mono",Consolas,monospace;
  font-size:.82rem;line-height:1.65;color:#c9d1d9;overflow-x:auto;white-space:pre;
  max-height:400px;overflow-y:auto;
}
.nb-output-block{
  background:rgba(34,197,94,.04);border:1px solid rgba(34,197,94,.15);
  border-radius:var(--radius-sm);padding:.6rem 1rem;margin-top:.4rem;
  font-family:"Cascadia Code","Fira Code",Consolas,monospace;font-size:.78rem;
  line-height:1.55;color:var(--text2);overflow-x:auto;white-space:pre-wrap;
  max-height:300px;overflow-y:auto;
}
.nb-output-label{font-size:.65rem;color:var(--green);margin-bottom:.2rem;text-transform:uppercase;letter-spacing:.3px}
.nb-markdown-block{
  font-size:.88rem;line-height:1.7;color:var(--text);padding:.25rem 0;
}
.nb-markdown-block h1{font-size:1.4rem;font-weight:700;margin:.8rem 0 .4rem;border-bottom:1px solid var(--bg4);padding-bottom:.3rem}
.nb-markdown-block h2{font-size:1.15rem;font-weight:600;margin:.7rem 0 .3rem;border-bottom:1px solid var(--bg4);padding-bottom:.2rem}
.nb-markdown-block h3{font-size:1rem;font-weight:600;margin:.6rem 0 .25rem}
.nb-markdown-block h4{font-size:.92rem;font-weight:600;margin:.5rem 0 .2rem}
.nb-markdown-block p{margin:.4rem 0}
.nb-markdown-block code{background:var(--bg3);padding:.1rem .35rem;border-radius:3px;font-size:.82rem;font-family:"Cascadia Code",Consolas,monospace}
.nb-markdown-block pre{background:var(--bg);border:1px solid var(--bg4);border-radius:var(--radius-sm);padding:.6rem .8rem;overflow-x:auto;margin:.5rem 0}
.nb-markdown-block pre code{background:none;padding:0}
.nb-markdown-block ul,.nb-markdown-block ol{margin:.4rem 0;padding-left:1.5rem}
.nb-markdown-block li{margin:.15rem 0}
.nb-markdown-block blockquote{border-left:3px solid var(--accent);padding-left:1rem;color:var(--text2);margin:.5rem 0}
.nb-markdown-block table{border-collapse:collapse;margin:.5rem 0;width:100%}
.nb-markdown-block th,.nb-markdown-block td{border:1px solid var(--bg4);padding:.35rem .6rem;font-size:.82rem}
.nb-markdown-block th{background:var(--bg3);font-weight:600}
.nb-markdown-block img{max-width:100%;border-radius:var(--radius-sm);margin:.5rem 0}
.nb-markdown-block a{color:var(--accent2)}
.nb-markdown-block hr{border:none;border-top:1px solid var(--bg4);margin:.8rem 0}
.nb-html-output{
  background:var(--bg);border:1px solid var(--bg4);border-radius:var(--radius-sm);
  padding:.75rem;margin-top:.4rem;overflow-x:auto;max-height:300px;overflow-y:auto;
}
.nb-html-output table{border-collapse:collapse;width:100%;font-size:.78rem}
.nb-html-output th,.nb-html-output td{border:1px solid var(--bg4);padding:.3rem .5rem;text-align:left}
.nb-html-output th{background:var(--bg3);font-weight:600}
.nb-image-output{margin-top:.4rem}
.nb-image-output img{max-width:100%;border-radius:var(--radius-sm)}
.nb-notebook-info{
  background:var(--bg3);border-radius:var(--radius-sm);padding:.85rem 1.2rem;
  margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:1.5rem;font-size:.82rem;
}
.nb-notebook-info .nb-info-item{display:flex;align-items:center;gap:.4rem;color:var(--text2)}
.nb-notebook-info .nb-info-item strong{color:var(--text)}

/* SECTION: saved notebooks */
.saved-section-title{font-size:1rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;color:var(--text2)}
.saved-section-title .saved-count{font-size:.78rem;color:var(--text3);font-weight:400}
.nb-delete-btn{
  position:absolute;top:.8rem;right:.8rem;width:24px;height:24px;
  border:none;border-radius:50%;background:rgba(239,68,68,.15);color:var(--red);
  cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;
}
.dataset-card:hover .nb-delete-btn{opacity:1}
.nb-delete-btn:hover{background:rgba(239,68,68,.3)}

/* SECTION: responsive */
@media(max-width:768px){
  .app-header{padding:0 1rem}
  .container{padding:1rem}
  .dataset-grid{grid-template-columns:1fr}
  .stats-bar{gap:.75rem}
  .stat-card{min-width:calc(50% - .5rem)}
  .toolbar{flex-direction:column}
  .search-box{min-width:100%}
  .detail-meta{gap:.75rem}
}
/* ===== 升级版新增样式 ===== */
.saved-card-actions{display:flex;gap:.35rem;margin-top:.6rem;align-items:center}
.nb-download-btn,.nb-export-btn{
  font-size:.68rem;padding:.25rem .55rem;border-radius:4px;cursor:pointer;
  background:var(--bg3);border:1px solid var(--bg4);color:var(--text2);transition:all .2s;white-space:nowrap;
}
.nb-download-btn:hover{border-color:var(--green);color:var(--green)}
.nb-export-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.backup-actions{display:inline-flex;gap:.4rem;margin-left:1rem;flex-wrap:wrap}
.nb-backup-btn{
  font-size:.72rem;padding:.3rem .7rem;border-radius:5px;cursor:pointer;
  background:var(--accent-bg);border:1px solid var(--accent);color:var(--accent2);transition:all .2s;white-space:nowrap;
}
.nb-backup-btn:hover{background:rgba(99,102,241,.22)}
.nb-tools{margin-bottom:1rem;display:flex;flex-direction:column;gap:.6rem}
.nb-search-box{position:relative;display:flex;align-items:center}
.nb-search-box input{
  width:100%;padding:.5rem 1rem .5rem 2.2rem;
  background:var(--bg);border:1px solid var(--bg4);border-radius:var(--radius);
  color:var(--text);font-size:.85rem;outline:none;transition:border .2s;
}
.nb-search-box input:focus{border-color:var(--accent)}
.nb-search-box .search-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.85rem;pointer-events:none}
.nb-search-count{position:absolute;right:.8rem;top:50%;transform:translateY(-50%);font-size:.72rem;color:var(--accent2)}
.nb-toc{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius-sm);padding:.6rem .8rem;max-height:220px;overflow-y:auto}
.nb-toc-title{font-size:.75rem;color:var(--text3);margin-bottom:.35rem;letter-spacing:.3px}
.nb-toc-item{font-size:.8rem;color:var(--text2);padding:.22rem .3rem;cursor:pointer;border-radius:4px;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-toc-item:hover{background:var(--accent-bg);color:var(--accent2)}
.nb-cell-label{justify-content:space-between}
.nb-cell-actions{display:inline-flex;gap:.35rem;margin-left:auto}
.nb-copy-btn,.nb-fold-btn,.nb-save-btn{
  font-size:.66rem;padding:.15rem .5rem;border-radius:4px;cursor:pointer;
  background:var(--bg3);border:1px solid var(--bg4);color:var(--text2);transition:all .2s;white-space:nowrap;
}
.nb-copy-btn:hover{background:rgba(99,102,241,.2);border-color:var(--accent);color:var(--accent2)}
.nb-fold-btn:hover{background:rgba(234,179,8,.15);border-color:var(--yellow);color:var(--yellow)}
.nb-save-btn{font-size:.72rem;padding:.2rem .6rem}
.nb-save-btn:hover{background:rgba(34,197,94,.15);border-color:var(--green);color:var(--green)}
.nb-code-block{position:relative}
.nb-cell.folded .nb-code-block,.nb-cell.folded .nb-output-block,.nb-cell.folded .nb-output-label{display:none}
.nb-cell.search-hit{border-left-color:var(--green);outline:1px solid rgba(34,197,94,.35);border-radius:var(--radius-sm)}
.nb-cell.toc-target{animation:tocFlash 1.2s ease}
@keyframes tocFlash{0%{background:rgba(99,102,241,.35)}100%{background:transparent}}
@media(max-width:768px){.backup-actions{margin-left:0;margin-top:.4rem}}

/* ===== 高级功能新增样式 ===== */
/* Python 语法高亮（暗色） */
.nb-code-block .tok-c{color:#6a9955;font-style:italic}
.nb-code-block .tok-s{color:#9ecbff}
.nb-code-block .tok-n{color:#f78c6c}
.nb-code-block .tok-k{color:#c792ea;font-weight:600}
.nb-code-block .tok-f{color:#82aaff}

/* 亮色主题 */
html[data-theme="light"]{
  --bg:#f4f6fb;--bg2:#ffffff;--bg3:#eef1f8;--bg4:#dde3f0;
  --text:#1f2430;--text2:#46506a;--text3:#8a93ac;
  --accent:#4f46e5;--accent2:#6366f1;--accent-bg:rgba(79,70,229,.1);
  --shadow:0 4px 24px rgba(30,40,90,.08);
}
html[data-theme="light"] .nb-code-block{background:#f7f8fb;border-color:#e2e6f0}
html[data-theme="light"] .nb-code-block .tok-c{color:#8a93ac}
html[data-theme="light"] .nb-code-block .tok-s{color:#0a7d3d}
html[data-theme="light"] .nb-code-block .tok-n{color:#b74a1a}
html[data-theme="light"] .nb-code-block .tok-k{color:#7b2fbe}
html[data-theme="light"] .nb-code-block .tok-f{color:#1a56c4}
html[data-theme="light"] .nb-markdown-block table th{background:var(--bg3)}

/* 主题按钮 */
.theme-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.35rem .7rem;border-radius:var(--radius-sm);
  background:var(--bg3);border:1px solid var(--bg4);color:var(--text2);
  font-size:.78rem;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.theme-btn:hover{border-color:var(--accent);color:var(--accent2)}
.header-stats .theme-btn{margin-left:.5rem}

/* Notebook 工具栏按钮 */
.nb-tools-btn{
  font-size:.72rem;padding:.28rem .7rem;border-radius:5px;cursor:pointer;
  background:var(--bg3);border:1px solid var(--bg4);color:var(--text2);transition:all .2s;white-space:nowrap;
}
.nb-tools-btn:hover{border-color:var(--accent);color:var(--accent2)}
.nb-tools-row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}

/* 导出/打印/复制全部 按钮（nb-info 内） */
.nb-info-actions{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.15rem}
.nb-info-actions .nb-backup-btn{font-size:.72rem}
.nb-info-actions .nb-backup-btn.green:hover{background:rgba(34,197,94,.18);border-color:var(--green);color:var(--green)}
.nb-info-actions .nb-backup-btn.yellow:hover{background:rgba(234,179,8,.16);border-color:var(--yellow);color:var(--yellow)}
.nb-info-actions .nb-backup-btn.cyan:hover{background:rgba(6,182,212,.16);border-color:var(--cyan);color:var(--cyan)}

/* 打印样式：只输出 Notebook 内容 */
@media print{
  .app-header,.toolbar,.stats-bar,.detail-header,.detail-meta,.nb-tools,
  .nb-copy-btn,.nb-fold-btn,.nb-save-btn,.nb-info-actions,.backup-actions,.nb-toc{display:none !important}
  body{background:#fff !important;color:#111 !important;font-size:12px}
  .detail-view{display:block !important}
  .nb-code-block{background:#f6f8fa !important;color:#24292e !important;border:1px solid #d0d7de !important;max-height:none !important;white-space:pre-wrap}
  .nb-cell.folded .nb-code-block{display:block !important}
  .nb-cell{break-inside:avoid}

/* SECTION: preview data generator */
function generatePreview(ds, count) {
  const rows = [];
  for (let i = 0; i < count; i++) {
    const row = {};
    ds.fields.forEach(f => {
      row[f.name] = sampleValue(f, i, ds);
    });
    rows.push(row);
  }
  return rows;
}

function sampleValue(f, i, ds) {
  const base = f.example || "";
  switch(f.type) {
    case "integer":
      if (f.name.includes("year")) return 2015 + (i % 12);
      if (f.name.includes("age")) return 18 + Math.floor(Math.random()*60);
      if (f.name.includes("count") || f.name.includes("citation")) return Math.floor(Math.random()*500);
      if (f.name.includes("passengers") || f.name.includes("daily")) return Math.floor(Math.random()*200000);
      if (f.name.includes("word")) return Math.floor(Math.random()*100);
      return Math.floor(Math.random()*1000);
    case "float":
      if (f.name.includes("price") || f.name.includes("avg")) return (Math.random()*50+1).toFixed(2);
      if (f.name.includes("ratio") || f.name.includes("rate") || f.name.includes("humidity")) return (Math.random()*100).toFixed(1);
      if (f.name.includes("temperature")) return (Math.random()*40-10).toFixed(1);
      if (f.name.includes("longitude")) return (100+Math.random()*30).toFixed(4);
      if (f.name.includes("latitude")) return (20+Math.random()*25).toFixed(4);
      if (f.name.includes("distance")) return (Math.random()*10).toFixed(1);
      if (f.name.includes("duration")) return (Math.random()*60).toFixed(1);
      if (f.name.includes("confidence")) return (Math.random()*0.5+0.5).toFixed(2);
      if (f.name.includes("revenue") || f.name.includes("profit")) return (Math.random()*1000).toFixed(1);
      if (f.name.includes("pe")) return (Math.random()*80+5).toFixed(1);
      return (Math.random()*100).toFixed(2);
    case "date":
    case "datetime":
      const d = new Date(2026, Math.floor(Math.random()*8), Math.floor(Math.random()*28)+1, Math.floor(Math.random()*24), Math.floor(Math.random()*60));
      return f.type === "datetime" ? d.toISOString().slice(0,16).replace("T"," ") : d.toISOString().slice(0,10);
    case "string":
      if (f.name.includes("city") || f.name.includes("market")) return ["北京","上海","广州","深圳","成都","杭州","武汉","南京"][i%8];
      if (f.name.includes("province") || f.name.includes("origin")) return ["山东","河南","广东","四川","浙江","江苏","湖北","福建"][i%8];
      if (f.name.includes("sentiment")) return ["positive","negative","neutral"][i%3];
      if (f.name.includes("device") || f.name.includes("user_type")) return i%3===0 ? "mobile" : i%3===1 ? "desktop" : "tablet";
      if (f.name.includes("weather")) return ["晴","多云","阴","小雨","大雨","雪"][i%6];
      if (f.name.includes("quality") || f.name.includes("level")) return ["优","良","轻度污染","中度污染"][i%4];
      if (f.name.includes("gender")) return i%2===0 ? "M" : "F";
      if (f.name.includes("event")) return ["view","click","add_cart","purchase"][i%4];
      if (f.name.includes("finding") && f.name.includes("type")) return ["结节","炎症","钙化","囊肿"][i%4];
      if (f.name.includes("source")) return ["微博","小红书","知乎","抖音"][i%4];
      if (f.name.includes("category")) return ["蔬菜","水果","粮食","水产","肉类"][i%5];
      if (f.name.includes("venue")) return ["NeurIPS","ICML","AAAI","ACL","CVPR"][i%5];
      if (f.name.includes("station") && f.name.includes("name")) return ["北京南","上海虹桥","广州南","深圳北","成都东","杭州东","武汉","南京南"][i%8];
      if (f.name.includes("diagnosis")) return ["良性结节","需随访","恶性可能","正常"][i%4];
      if (f.name.includes("supply")) return ["一级批发","二级批发","零售终端","产地直供"][i%4];
      return base || `sample_${i}`;
    default:
      return base || "";
  }
}

/* SECTION: state */
let currentFilters = { search:"", formats:[], tags:[] };
let allTags = [], allFormats = [];

/* SECTION: render functions */
function init() {
  // extract unique tags & formats
  const tagSet = new Set(), fmtSet = new Set();
  DATASETS.forEach(d => { d.tags.forEach(t => tagSet.add(t)); fmtSet.add(d.format); });
  allTags = [...tagSet]; allFormats = [...fmtSet];

  // header stats
  document.getElementById("total-count").textContent = DATASETS.length;
  document.getElementById("format-count").textContent = allFormats.length;

  // format filter buttons
  const fmtEl = document.getElementById("format-filters");
  fmtEl.innerHTML = allFormats.map(f => `<button class="filter-btn" data-format="${f}">${f}</button>`).join("");

  // tag filter buttons
  const tagEl = document.getElementById("tag-filters");
  tagEl.innerHTML = allTags.map(t => `<button class="filter-btn" data-tag="${t}">${t}</button>`).join("");

  // stats bar
  renderStats();

  // render grid
  renderGrid();

  // bind events
  document.getElementById("search-input").addEventListener("input", e => {
    currentFilters.search = e.target.value.toLowerCase();
    renderGrid();
  });

  fmtEl.addEventListener("click", e => {
    if (!e.target.classList.contains("filter-btn")) return;
    e.target.classList.toggle("active");
    const fmt = e.target.dataset.format;
    const idx = currentFilters.formats.indexOf(fmt);
    if (idx > -1) currentFilters.formats.splice(idx, 1); else currentFilters.formats.push(fmt);
    renderGrid();
  });

  tagEl.addEventListener("click", e => {
    if (!e.target.classList.contains("filter-btn")) return;
    e.target.classList.toggle("active");
    const tag = e.target.dataset.tag;
    const idx = currentFilters.tags.indexOf(tag);
    if (idx > -1) currentFilters.tags.splice(idx, 1); else currentFilters.tags.push(tag);
    renderGrid();
  });

  document.getElementById("back-btn").addEventListener("click", showList);

  // notebook import
  const importBtn = document.getElementById("import-btn");
  const fileInput = document.getElementById("import-file-input");
  importBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", handleNotebookImport);
  
  // Load saved notebooks on startup
  if (typeof loadSavedNotebooks === 'function') {
    loadSavedNotebooks();
  }
}

function getFiltered() {
  return DATASETS.filter(d => {
    if (currentFilters.search) {
      const s = currentFilters.search;
      const haystack = (d.name + d.desc + d.tags.join(" ") + d.format).toLowerCase();
      if (!haystack.includes(s)) return false;
    }
    if (currentFilters.formats.length && !currentFilters.formats.includes(d.format)) return false;
    if (currentFilters.tags.length && !d.tags.some(t => currentFilters.tags.includes(t))) return false;
    return true;
  });
}

function renderStats() {
  const filtered = getFiltered();
  const totalRows = filtered.reduce((s, d) => s + parseInt(d.rows.replace(/,/g,"")), 0);
  const fmts = new Set(filtered.map(d => d.format));
  const tags = new Set(); filtered.forEach(d => d.tags.forEach(t => tags.add(t)));

  document.getElementById("stats-bar").innerHTML = `
    <div class="stat-card"><div class="stat-label">数据集</div><div class="stat-value">${filtered.length}<span class="unit">个</span></div></div>
    <div class="stat-card"><div class="stat-label">数据总量</div><div class="stat-value">${formatNum(totalRows)}<span class="unit">行</span></div></div>
    <div class="stat-card"><div class="stat-label">涉及格式</div><div class="stat-value">${fmts.size}<span class="unit">种</span></div></div>
    <div class="stat-card"><div class="stat-label">涉及标签</div><div class="stat-value">${tags.size}<span class="unit">个</span></div></div>
  `;
}

function formatNum(n) {
  if (n >= 1e9) return (n/1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n/1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n/1e3).toFixed(1) + "K";
  return n.toString();
}

function renderGrid() {
  const filtered = getFiltered();
  const grid = document.getElementById("dataset-grid");
  const empty = document.getElementById("empty-state");

  renderStats();

  if (filtered.length === 0) {
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  grid.innerHTML = filtered.map(d => `
    <div class="dataset-card" data-id="${d.id}" data-primary-action="view-detail">
      <div class="card-header">
        <div class="card-title">${d.name}</div>
        <span class="card-format fmt-${d.format.toLowerCase()}">${d.format}</span>
      </div>
      <div class="card-desc">${d.desc}</div>
      <div class="card-meta">
        <span>&#128190; ${d.size}</span>
        <span>&#128200; ${d.rows} 行</span>
        <span>&#128197; ${d.updated}</span>
      </div>
      <div class="card-tags">${d.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
    </div>
  `).join("");

  grid.querySelectorAll(".dataset-card").forEach(card => {
    card.addEventListener("click", () => showDetail(parseInt(card.dataset.id)));
  });
}

/* SECTION: detail view */
function showDetail(id) {
  const ds = DATASETS.find(d => d.id === id);
  if (!ds) return;

  document.getElementById("list-view").classList.add("hidden");
  const dv = document.getElementById("detail-view");
  dv.classList.add("active");

  // title area
  document.getElementById("detail-title-area").innerHTML = `
    <h2>${ds.name} <span class="detail-format fmt-${ds.format.toLowerCase()}">${ds.format}</span></h2>
    <div class="detail-desc">${ds.desc}</div>
    <div class="detail-tags">${ds.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
  `;

  // meta
  document.getElementById("detail-meta").innerHTML = `
    <div class="meta-item">&#128190; 大小：<strong>${ds.size}</strong></div>
    <div class="meta-item">&#128200; 行数：<strong>${ds.rows}</strong></div>
    <div class="meta-item">&#128218; 字段：<strong>${ds.fields.length}</strong></div>
    <div class="meta-item">&#128197; 更新：<strong>${ds.updated}</strong></div>
  `;

  // field table
  const ftb = document.querySelector("#field-table tbody");
  ftb.innerHTML = ds.fields.map(f => `
    <tr>
      <td><code>${f.name}</code></td>
      <td><span class="field-type">${f.type}</span></td>
      <td>${f.desc}</td>
      <td>${f.example}</td>
      <td>${f.null_rate}</td>
    </tr>
  `).join("");

  // stats summary
  document.getElementById("stats-summary").innerHTML = ds.stats.map(s => `
    <div class="stats-item">
      <div class="si-label">${s.label}</div>
      <div class="si-value">${s.value}</div>
      <div class="si-sub">${s.sub}</div>
    </div>
  `).join("");

  // preview table
  const preview = generatePreview(ds, 30);
  const thead = document.querySelector("#preview-table thead tr");
  const tbody = document.querySelector("#preview-table tbody");
  thead.innerHTML = ds.fields.map(f => `<th>${f.name}</th>`).join("");
  tbody.innerHTML = preview.map(row =>
    `<tr>${ds.fields.map(f => `<td title="${row[f.name]}">${row[f.name]}</td>`).join("")}</tr>`
  ).join("");

  window.scrollTo(0, 0);
}

function showList() {
  document.getElementById("detail-view").classList.remove("active");
  document.getElementById("list-view").classList.remove("hidden");
  // reset notebook section
  document.getElementById("notebook-section").style.display = "none";
  document.getElementById("nb-viewer").innerHTML = "";
  document.getElementById("nb-info").innerHTML = "";
  // restore standard sections
  document.querySelectorAll(".detail-section").forEach(s => s.style.display = "");
}

/* SECTION: notebook import */
let importedNotebooks = []; // saved notebooks list

function handleNotebookImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  // Check file extension
  if (!file.name.toLowerCase().endsWith('.ipynb')) {
    alert('请选择 .ipynb 格式的 Jupyter Notebook 文件');
    return;
  }
  
  // Check file size (limit to 50MB)
  if (file.size > 50 * 1024 * 1024) {
    alert('文件过大（超过 50MB），请选择较小的 Notebook 文件');
    return;
  }
  
  const reader = new FileReader();
  
  reader.onerror = function() {
    alert('文件读取失败，请重试。');
    e.target.value = "";
  };
  
  reader.onload = function(ev) {
    try {
      const text = ev.target.result;
      
      let nb;
      try {
        nb = JSON.parse(text);
      } catch (jsonErr) {
        alert('无法解析该文件：\n\nJSON 格式错误 - ' + jsonErr.message + '\n\n可能原因：\n1. 文件编码不是 UTF-8\n2. 文件已损坏或不完整\n\n建议：在 Jupyter 中重新保存该文件，然后重试。\n\n请确保按 Ctrl+F5 强制刷新页面后重试。');
        e.target.value = "";
        return;
      }
      
      // Validate notebook structure
      if (!nb.cells || !Array.isArray(nb.cells)) {
        alert('无效文件：缺少 cells 字段或格式不正确\n\n这不是一个标准的 Jupyter Notebook 文件。');
        e.target.value = "";
        return;
      }
      
      if (nb.cells.length === 0) {
        alert('该 Notebook 是空的（没有任何单元格）');
        e.target.value = "";
        return;
      }
      
      // Save to system (localStorage)
      saveNotebook(nb, file.name, file.size);
      
      // Render
      renderNotebook(nb, file.name);
      
    } catch (err) {
      alert('导入出错：' + err.message + '\n\n请确保按 Ctrl+F5 强制刷新页面后重试。');
      console.error('Import error:', err);
    }
    
    e.target.value = "";
  };
  
  reader.readAsText(file, 'UTF-8');
}

function saveNotebook(nb, filename, fileSize) {
  try {
    // Get existing saved notebooks
    let saved = [];
    try {
      const raw = localStorage.getItem('ds_viewer_notebooks');
      if (raw) saved = JSON.parse(raw);
    } catch(e) { saved = []; }
    
    // Check if already exists, update it
    const existingIdx = saved.findIndex(n => n.filename === filename);
    
    // Create a lightweight version for storage (strip large image data to save space)
    const lightNb = JSON.parse(JSON.stringify(nb));
    let totalSize = JSON.stringify(lightNb).length;
    
    // If too large for localStorage (>3MB), strip image data
    if (totalSize > 3 * 1024 * 1024) {
      lightNb.cells.forEach(cell => {
        if (cell.outputs) {
          cell.outputs.forEach(out => {
            if (out.data) {
              if (out.data["image/png"]) out.data["image/png"] = ["[图片数据已省略]"];
              if (out.data["image/jpeg"]) out.data["image/jpeg"] = ["[图片数据已省略]"];
              if (out.data["image/svg+xml"]) {
                const svg = Array.isArray(out.data["image/svg+xml"]) ? out.data["image/svg+xml"].join("") : out.data["image/svg+xml"];
                if (svg.length > 5000) out.data["image/svg+xml"] = ["[SVG数据过大已省略]"];
              }
            }
          });
        }
      });
    }
    
    const entry = {
      filename: filename,
      name: filename.replace(/\.ipynb$/i, ""),
      cells: lightNb.cells.length,
      codeCells: lightNb.cells.filter(c => c.cell_type === "code").length,
      mdCells: lightNb.cells.filter(c => c.cell_type === "markdown").length,
      kernel: (lightNb.metadata && lightNb.metadata.kernelspec) ? lightNb.metadata.kernelspec.display_name : "未知",
      lang: (lightNb.metadata && lightNb.metadata.language_info) ? lightNb.metadata.language_info.name : "未知",
      savedAt: new Date().toLocaleString("zh-CN"),
      nbData: lightNb
    };
    
    if (existingIdx >= 0) {
      saved[existingIdx] = entry;
    } else {
      saved.push(entry);
    }
    
    localStorage.setItem('ds_viewer_notebooks', JSON.stringify(saved));
    importedNotebooks = saved;
  } catch (storageErr) {
    // localStorage might be full or disabled, continue without saving
    console.warn('无法保存到本地存储:', storageErr.message);
  }
}

        codeIdx++;
        const outputHtml = renderCellOutputs(cell.outputs || []);
        return `<div class="nb-cell code-cell">
          <div class="nb-cell-label"><span class="cell-type-badge">Code</span><span class="cell-index">In [${cell.execution_count || codeIdx}]</span></div>

        return `<div class="nb-cell markdown-cell">

        </div>`;
      } else {
        return `<div class="nb-cell raw-cell">
          <div class="nb-cell-label"><span class="cell-type-badge">Raw</span></div>

        <div class="nb-code-block" style="color:var(--red)">单元格 ${i+1} 渲染出错: ${escHtml(cellErr.message)}</div>
      </div>`;

  document.querySelector("#field-table").closest(".detail-section").style.display = "none";

  document.querySelector("#preview-table").closest(".detail-section").style.display = "none";

}

function renderCellOutputs(outputs) {
  if (!outputs.length) return "";
  return outputs.map(out => {
    let content = "";
    if (out.output_type === "stream") {
      const text = nbText(out.text);
      content = `<div class="nb-output-label">Output</div><div class="nb-output-block">${escHtml(text)}</div>`;
    } else if (out.output_type === "execute_result" || out.output_type === "display_data") {
      const data = out.data || {};
      if (data["text/html"]) {
        const html = nbText(data["text/html"]);
        content = `<div class="nb-output-label">HTML Output</div><div class="nb-html-output">${html}</div>`;
      } else if (data["image/png"]) {
        const b64 = nbText(data["image/png"]);
        content = `<div class="nb-output-label">Image</div><div class="nb-image-output"><img src="data:image/png;base64,${b64}" alt="output"></div>`;
      } else if (data["image/svg+xml"]) {
        const svg = nbText(data["image/svg+xml"]);
        content = `<div class="nb-output-label">SVG</div><div class="nb-image-output">${svg}</div>`;
      } else if (data["text/plain"]) {
        const text = nbText(data["text/plain"]);
        content = `<div class="nb-output-label">Output</div><div class="nb-output-block">${escHtml(text)}</div>`;
      }
    } else if (out.output_type === "error") {
      const tb = nbText(out.traceback);
      const cleanTb = tb.replace(/\x1b\[[0-9;]*m/g, "");
      content = `<div class="nb-output-label" style="color:var(--red)">Error</div><div class="nb-output-block" style="border-color:rgba(239,68,68,.3);color:var(--red)">${escHtml((out.ename || "") + ": " + (out.evalue || "") + "\n" + cleanTb)}</div>`;
    }
    return content;
  }).join("");
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* notebook cell field may be string or string[]; normalize to string */
function nbText(val) {
  if (val == null) return "";
  if (Array.isArray(val)) return val.join("");
  return String(val);
}

/* SECTION: simple markdown renderer */
function renderMarkdown(src) {
  let html = src;
  // code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${escHtml(code.trim())}</code></pre>`);
  // inline code
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  // headings
  html = html.replace(/^#### (.+)$/gm, "<h4>$1</h4>");
  html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.+)$/gm, "<h1>$1</h1>");
  // bold & italic
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*(.+?)\*/g, "<em>$1</em>");
  // links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // images
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
  // blockquote
  html = html.replace(/^> (.+)$/gm, "<blockquote>$1</blockquote>");
  // hr
  html = html.replace(/^---$/gm, "<hr>");
  // unordered list
  html = html.replace(/^[\-\*] (.+)$/gm, "<li>$1</li>");
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, "<ul>$1</ul>");
  // ordered list
  html = html.replace(/^\d+\. (.+)$/gm, "<li>$1</li>");
  // tables
  html = html.replace(/^\|(.+)\|\s*\n\|[-\s|:]+\|\s*\n((?:\|.+\|\s*\n?)*)/gm, (_, header, body) => {
    const ths = header.split("|").map(c => c.trim()).filter(Boolean).map(c => `<th>${c}</th>`).join("");
    const rows = body.trim().split("\n").map(row => {
      const tds = row.split("|").map(c => c.trim()).filter(Boolean).map(c => `<td>${c}</td>`).join("");
      return `<tr>${tds}</tr>`;
    }).join("");
    return `<table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table>`;
  });
  // paragraphs
  html = html.replace(/\n\n/g, "</p><p>");
  html = "<p>" + html + "</p>";
  // clean up
  html = html.replace(/<p><(h[1-4]|pre|ul|ol|blockquote|hr|table)/g, "<$1");
  html = html.replace(/<\/(h[1-4]|pre|ul|ol|blockquote|table)><\/p>/g, "</$1>");
  html = html.replace(/<p><\/p>/g, "");
  return html;
}

/* ====== 升级版功能（保存/导出、内容搜索、大纲、复制、折叠） ====== */
function downloadBlob(content, filename, mime) {
  var blob = new Blob([content], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
}

function copyTextFallback(text, done, fail) {
  function legacy() {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    if (ok) { done(); } else { fail(); }
  }
  if (navigator.clipboard && window.isSecureContext !== false) {
    navigator.clipboard.writeText(text).then(done, legacy);
  } else {
    legacy();
  }
}

function normalizeNb(nb) {
  if (!nb) return null;
  var out = JSON.parse(JSON.stringify(nb));
  if (!out.nbformat) out.nbformat = 4;
  if (!out.nbformat_minor) out.nbformat_minor = 5;
  if (!out.metadata) out.metadata = {};
  if (!out.cells) out.cells = [];
  return out;
}

          savedAt: n.savedAt || new Date().toLocaleString("zh-CN"),
          nbData: nbData
        };
        if (idx >= 0) { saved[idx] = entry; } else { saved.push(entry); }
        added++;
      });
      importedNotebooks = saved;
      localStorage.setItem("ds_viewer_notebooks", JSON.stringify(saved));

    }
  };

    if (o.text) s += nbText(o.text) + " ";
    if (o.data) {

document.addEventListener("click", function (e) {
  var t = e.target;
  var el;
  el = t.closest ? t.closest(".nb-download-btn") : null;
  if (el) { e.stopPropagation(); downloadNotebook(parseInt(el.dataset.dlIdx, 10)); return; }
  el = t.closest ? t.closest(".nb-export-btn") : null;
  if (el) { e.stopPropagation(); exportSingleNotebook(parseInt(el.dataset.exIdx, 10)); return; }
  el = t.closest ? t.closest(".nb-delete-btn") : null;
  if (el) {
    e.stopPropagation();
    var idx = parseInt(el.dataset.delIdx, 10);
    if (confirm("确定要删除「" + importedNotebooks[idx].name + "」吗？")) {
      importedNotebooks.splice(idx, 1);
      localStorage.setItem("ds_viewer_notebooks", JSON.stringify(importedNotebooks));
      renderSavedNotebooks();
    }
    return;
  }
  el = t.closest ? t.closest(".nb-copy-btn") : null;
  if (el) {
    var cellEl = document.getElementById("nb-cell-" + el.dataset.copyCell);
    if (cellEl) {
      var codeEl = cellEl.querySelector(".nb-code-block");
      var text = codeEl ? codeEl.textContent : "";
      copyTextFallback(text, function () {
        el.textContent = "已复制 ✓";
        setTimeout(function () { el.textContent = "复制"; }, 1500);
      }, function () { alert("复制失败，请手动选择代码后复制"); });
    }
    return;
  }
  el = t.closest ? t.closest(".nb-fold-btn") : null;
  if (el) {
    var cellF = document.getElementById("nb-cell-" + el.dataset.foldCell);
    if (cellF) {
      var folded = cellF.classList.toggle("folded");
      el.textContent = folded ? "展开" : "折叠";
    }
    return;
  }
  el = t.closest ? t.closest(".nb-toc-item") : null;
  if (el) {
    var tocEntry = window.tocItems[parseInt(el.dataset.toc, 10)];
    if (tocEntry) {
      var target = document.getElementById("nb-cell-" + tocEntry.cell);
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
        target.classList.add("toc-target");
        setTimeout(function () { target.classList.remove("toc-target"); }, 1500);
      }
    }
    return;
  }

  if (el && window._currentNb) {
    downloadBlob(JSON.stringify(normalizeNb(window._currentNb.nb), null, 1), window._currentNb.filename, "application/json");

});

/* ====== 高级功能包（语法高亮 / 导出 / 打印 / 复制全部 / 主题切换 / 快捷键 / 统计 / 全部展开折叠） ====== */
function hlPython(code) {
  var re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|(\b(?:and|or|not|if|elif|else|for|while|def|class|return|import|from|as|in|is|None|True|False|try|except|finally|raise|with|lambda|pass|break|continue|global|nonlocal|del|yield|assert|async|await)\b)|([A-Za-z_]\w*)(?=\()/g;
  var out = "", last = 0, m;
  while ((m = re.exec(code)) !== null) {
    out += escHtml(code.slice(last, m.index));
    if (m[1]) out += '<span class="tok-c">' + escHtml(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tok-s">' + escHtml(m[2]) + '</span>';
    else if (m[3]) out += '<span class="tok-n">' + m[3] + '</span>';
    else if (m[4]) out += '<span class="tok-k">' + m[4] + '</span>';
    else if (m[5]) out += '<span class="tok-f">' + m[5] + '</span>';
    last = m.index + m[0].length;
  }
  out += escHtml(code.slice(last));
  return out;
}

function exportNotebookMarkdown() {
  var nb = window._currentNb && window._currentNb.nb;
  if (!nb) { alert("请先打开一个 Notebook"); return; }
  var lines = [];
  (nb.cells || []).forEach(function (c, i) {
    if (i > 0) lines.push("");
    if (c.cell_type === "markdown") {
      lines.push(nbText(c.source).replace(/\s+$/, ""));
    } else if (c.cell_type === "code") {
      lines.push("```python");
      lines.push(nbText(c.source).replace(/\n$/, ""));
      lines.push("```");
      var txt = cellOutText(c.outputs).replace(/\s+$/, "");
      if (txt.trim()) { lines.push("```output"); lines.push(txt.trim()); lines.push("```"); }
    }
  });
  var fname = (window._currentNb.filename || "notebook").replace(/\.ipynb$/i, "") + ".md";
  downloadBlob(lines.join("\n"), fname, "text/markdown;charset=utf-8");
}

function copyAllCode(done, fail) {
  var nb = window._currentNb && window._currentNb.nb;
  if (!nb) { if (fail) fail(); return; }
  var parts = [];
  (nb.cells || []).forEach(function (c) {
    if (c.cell_type === "code") parts.push(nbText(c.source).replace(/\n$/, ""));
  });
  copyTextFallback(parts.join("\n\n"), done, fail);
}

      setTimeout(function () { el.textContent = orig; }, 1500);
    }, function () { alert("复制失败，请手动复制"); });
    return;
  }
  el = t.closest ? t.closest("#nb-expand-all") : null;
  if (el) { toggleAllCells(true); return; }
  el = t.closest ? t.closest("#nb-collapse-all") : null;
  if (el) { toggleAllCells(false); return; }
  el = t.closest ? t.closest("#theme-btn") : null;
  if (el) {
    var cur = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    setTheme(cur);
    return;
  }
});

/* ---- 高级初始化：主题按钮 + 记忆 + 快捷键 ---- */

/* ====== 视觉与功能增强包（行号 / 图片放大 / 进度条 / 回顶 / 单元格移动 / 导出HTML / MD复制 / 最近查看） ====== */
function lineNumbers(src) {
  var n = src.split("\n").length, arr = [];
  for (var i = 1; i <= n; i++) arr.push(i);
  return arr.join("\n");
}

function exportNotebookHTML() {
  var nb = window._currentNb && window._currentNb.nb;
  if (!nb) { alert("请先打开一个 Notebook"); return; }
  var style = [
    "body{font-family:'Segoe UI',Roboto,'Noto Sans SC',sans-serif;background:#0f1117;color:#e2e8f0;line-height:1.7;margin:0;padding:2rem 2.4rem 4rem;max-width:1080px;margin:0 auto}",
    "h1,h2,h3,h4{border-bottom:1px solid #262940;padding-bottom:.35rem;margin:1.2rem 0 .6rem}",
    "pre{background:#161822;border:1px solid #262940;border-radius:8px;padding:.8rem 1rem;overflow-x:auto;font-size:.84rem;line-height:1.6}",
    "pre.code{white-space:pre;background:#0b0e16}",
    "pre.out{background:#0d2016;border-color:#1b3a28;color:#9fddb0}",
    "code{font-family:Consolas,'Cascadia Code',monospace}",
    "table{border-collapse:collapse;margin:.6rem 0;width:100%}",
    "th,td{border:1px solid #262940;padding:.4rem .65rem;font-size:.84rem}",
    "th{background:#1e2030}",
    "blockquote{border-left:3px solid #6366f1;padding-left:1rem;color:#94a3b8;margin:.6rem 0}",
    "img{max-width:100%;border-radius:8px}",
    "a{color:#818cf8}",
    ".badge{font-size:.68rem;color:#818cf8;letter-spacing:.5px;text-transform:uppercase;margin-bottom:.3rem}",
    ".tok-c{color:#6a9955;font-style:italic}.tok-s{color:#9ecbff}.tok-n{color:#f78c6c}.tok-k{color:#c792ea;font-weight:600}.tok-f{color:#82aaff}"
  ].join("\n");
  var cellsHtml = (nb.cells || []).map(function (c, i) {
    if (c.cell_type === "markdown") {
      return '<section>' + renderMarkdown(nbText(c.source)) + '</section>';
    }
    if (c.cell_type === "code") {
      var out = cellOutText(c.outputs).replace(/\s+$/, "");
      var outHtml = out ? '<pre class="out">' + escHtml(out) + '</pre>' : "";
      return '<section><div class="badge">Code ' + (i + 1) + '</div><pre class="code">' + hlPython(nbText(c.source)) + '</pre>' + outHtml + '</section>';
    }
    return "";
  }).join("");
  var html = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>' + escHtml((window._currentNb.filename || "notebook").replace(/\.ipynb$/i, "")) + ' - 报告</title>\n<style>' + style + '</style>\n</head>\n<body>\n' + cellsHtml + '\n</body>\n</html>';
  var fname = (window._currentNb.filename || "notebook").replace(/\.ipynb$/i, "") + ".html";
  downloadBlob(html, fname, "text/html;charset=utf-8");
}

function moveCell(i, dir) {
  var nb = window._currentNb && window._currentNb.nb;
  if (!nb || !nb.cells) return;
  var j = i + dir;
  if (j < 0 || j >= nb.cells.length) return;
  var t = nb.cells[i]; nb.cells[i] = nb.cells[j]; nb.cells[j] = t;
  renderNotebook(nb, window._currentNb.filename);
}

function pushRecent(filename) {
  if (!filename) return;
  var list = [];
  try { list = JSON.parse(localStorage.getItem("dv_recent") || "[]"); } catch (e) { list = []; }
  list = list.filter(function (x) { return x.filename !== filename; });
  list.unshift({ filename: filename, time: new Date().toLocaleString("zh-CN") });
  list = list.slice(0, 6);
  try { localStorage.setItem("dv_recent", JSON.stringify(list)); } catch (e) {}
}

function renderRecentList() {
  var sec = document.getElementById("recent-section");
  if (!sec) return;
  var list = [];
  try { list = JSON.parse(localStorage.getItem("dv_recent") || "[]"); } catch (e) { list = []; }
  if (!list.length) { sec.style.display = "none"; sec.innerHTML = ""; return; }
  sec.style.display = "";
  sec.innerHTML =
    '<div class="saved-section-title">&#128337; 最近查看 <span class="saved-count">' + list.length + '</span></div>' +
    '<div class="recent-chips">' + list.map(function (x, i) {
      return '<span class="recent-chip" data-recent="' + i + '" title="' + escHtml(x.time) + '">&#128196; ' + escHtml(x.filename) + '</span>';
    }).join("") + '</div>';
}

function openLightbox(src) {
  var ov = document.getElementById("nb-lightbox");
  if (!ov) {

    ov.id = "nb-lightbox";
    ov.className = "nb-lightbox";

    document.body.appendChild(ov);
  }

  img.src = src;
  ov.style.display = "flex";
}

function closeLightbox() {
  var ov = document.getElementById("nb-lightbox");
  if (ov) ov.style.display = "none";
}

/* ---- 重写 renderNotebook v4：行号 / 移动按钮 / MD代码复制 / 最近查看 ---- */
function renderNotebook(nb, filename) {
  window._currentNb = { nb: nb, filename: filename };
  pushRecent(filename);
  document.getElementById("list-view").classList.add("hidden");
  var dv = document.getElementById("detail-view");
  dv.classList.add("active");

  var name = filename.replace(/\.ipynb$/i, "");
  document.getElementById("detail-title-area").innerHTML =
    '<h2>' + escHtml(name) + ' <span class="detail-format fmt-json">Notebook</span></h2>' +
    '<div class="detail-desc">从本地导入的 Jupyter Notebook 文件</div>' +
    '<div class="detail-tags"><span class="tag">ipynb</span><span class="tag">导入</span><span class="tag">已保存</span></div>';

  var cells = nb.cells || [];
  var codeCells = cells.filter(function (c) { return c.cell_type === "code"; }).length;
  var mdCells = cells.filter(function (c) { return c.cell_type === "markdown"; }).length;
  var kernel = (nb.metadata && nb.metadata.kernelspec) ? nb.metadata.kernelspec.display_name : "未知";
  var lang = (nb.metadata && nb.metadata.language_info) ? nb.metadata.language_info.name : "未知";

  var totalLines = 0, totalChars = 0, imgCells = 0;
  cells.forEach(function (c) {
    if (c.cell_type !== "code") return;
    var src = nbText(c.source);
    totalLines += src.split("\n").length;
    totalChars += src.length;
    if (c.outputs && c.outputs.some(function (o) {
      return o.data && (o.data["image/png"] || o.data["image/svg+xml"]);
    })) imgCells++;
  });

  document.getElementById("detail-meta").innerHTML =
    '<div class="meta-item">&#128196; 单元格：<strong>' + cells.length + '</strong></div>' +
    '<div class="meta-item">&#128187; 代码单元：<strong>' + codeCells + '</strong></div>' +
    '<div class="meta-item">&#128221; Markdown：<strong>' + mdCells + '</strong></div>' +
    '<div class="meta-item">&#9881; 内核：<strong>' + escHtml(kernel) + '</strong></div>' +
    '<div class="meta-item">&#128295; 语言：<strong>' + escHtml(lang) + '</strong></div>' +
    '<div class="meta-item">&#128220; 代码行：<strong>' + totalLines + '</strong></div>' +
    '<div class="meta-item">&#128227; 字符：<strong>' + totalChars + '</strong></div>' +
    (imgCells ? '<div class="meta-item">&#128444; 含图输出：<strong>' + imgCells + '</strong> 个单元</div>' : '');

  document.querySelectorAll(".detail-section").forEach(function (s) {
    if (s.id !== "notebook-section") s.style.display = "none";
  });

  var nbSection = document.getElementById("notebook-section");
  nbSection.style.display = "";

  document.getElementById("nb-info").innerHTML =
    '<div class="nb-info-item">&#128194; <strong>' + escHtml(filename) + '</strong></div>' +
    '<div class="nb-info-item">内核：<strong>' + escHtml(kernel) + '</strong></div>' +
    '<div class="nb-info-item">语言：<strong>' + escHtml(lang) + '</strong></div>' +
    '<div class="nb-info-item">nbformat：<strong>' + (nb.nbformat || "-") + '</strong></div>' +
    '<div class="nb-info-item" style="flex:1;min-width:100%">' +
      '<div class="nb-info-actions">' +
        '<button class="nb-backup-btn green" id="nb-save-btn" title="下载此 Notebook 到本地">&#128229; 下载 .ipynb</button>' +
        '<button class="nb-backup-btn yellow" id="nb-export-md" title="导出为 Markdown 文件">&#128196; 导出 Markdown</button>' +
        '<button class="nb-backup-btn" id="nb-export-html" title="导出为独立 HTML 报告">&#127760; 导出 HTML 报告</button>' +
        '<button class="nb-backup-btn cyan" id="nb-print" title="打印 / 另存为 PDF">&#128424; 打印</button>' +
        '<button class="nb-backup-btn" id="nb-copy-all" title="一键复制全部代码">&#128203; 复制全部代码</button>' +
      '</div>' +
    '</div>';

  var toc = [];
  cells.forEach(function (cell, i) {
    if (cell.cell_type !== "markdown") return;
    var src = nbText(cell.source);
    var re = /^(#{1,4})\s+(.+)$/gm;
    var m;
    while ((m = re.exec(src)) !== null) {
      toc.push({ level: m[1].length, text: m[2].trim().replace(/\*\*|`/g, ""), cell: i });
    }
  });
  window.tocItems = toc;

  var viewer = document.getElementById("nb-viewer");
  var codeIdx = 0;

  var tocHtml = toc.length
    ? '<div class="nb-toc">' +
        '<div class="nb-toc-title">&#128203; 大纲目录（' + toc.length + '）</div>' +
        '<div class="nb-toc-list">' + toc.map(function (t, ti) {
          return '<div class="nb-toc-item" data-toc="' + ti + '" style="padding-left:' + ((t.level - 1) * 14) + 'px">' + escHtml(t.text) + '</div>';
        }).join("") + '</div>' +
      '</div>'
    : "";

  var cellHtml = cells.map(function (cell, i) {
    try {
      var src = nbText(cell.source);
      if (cell.cell_type === "code") {
        codeIdx++;
        var outputHtml = renderCellOutputs(cell.outputs || []);
        var longCode = src.length > 800;
        return '<div class="nb-cell code-cell" id="nb-cell-' + i + '" data-search-text="' + escHtml((src + " " + cellOutText(cell.outputs)).toLowerCase()) + '" data-folded="' + (longCode ? 1 : 0) + '">' +
          '<div class="nb-cell-label"><span class="cell-type-badge">Code</span><span class="cell-index">In [' + (cell.execution_count || codeIdx) + ']</span>' +
            '<span class="nb-cell-actions">' +
              '<button class="nb-move-btn" data-move-cell="' + i + '" data-move-dir="-1" title="上移">&#9650;</button>' +
              '<button class="nb-move-btn" data-move-cell="' + i + '" data-move-dir="1" title="下移">&#9660;</button>' +
              '<button class="nb-copy-btn" data-copy-cell="' + i + '">复制</button>' +
              '<button class="nb-fold-btn" data-fold-cell="' + i + '">' + (longCode ? "展开" : "折叠") + '</button>' +
            '</span>' +
          '</div>' +
          '<div class="nb-code-block hl"><div class="nb-lines">' + lineNumbers(src) + '</div><div class="nb-code-hl">' + hlPython(src) + '</div></div>' +
          outputHtml +
        '</div>';
      } else if (cell.cell_type === "markdown") {
        var mdHtml = renderMarkdown(src);
        mdHtml = mdHtml.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g, function (mm, code) {
          return '<div class="md-pre"><button class="md-copy-btn" title="复制代码">复制</button><pre><code>' + code + '</code></pre></div>';
        });
        return '<div class="nb-cell markdown-cell" id="nb-cell-' + i + '" data-search-text="' + escHtml(nbText(cell.source).toLowerCase()) + '">' +
          '<div class="nb-cell-label"><span class="cell-type-badge">Markdown</span></div>' +
          '<div class="nb-markdown-block">' + mdHtml + '</div>' +
        '</div>';
      } else {
        return '<div class="nb-cell raw-cell" id="nb-cell-' + i + '" data-search-text="' + escHtml(nbText(cell.source).toLowerCase()) + '">' +
          '<div class="nb-cell-label"><span class="cell-type-badge">Raw</span></div>' +
          '<div class="nb-code-block">' + escHtml(src) + '</div>' +
        '</div>';
      }
    } catch (cellErr) {
      return '<div class="nb-cell raw-cell" id="nb-cell-' + i + '">' +
        '<div class="nb-cell-label"><span class="cell-type-badge" style="background:rgba(239,68,68,.15);color:var(--red)">Error</span></div>' +
        '<div class="nb-code-block" style="color:var(--red)">单元格 ' + (i + 1) + ' 渲染出错: ' + escHtml(cellErr.message) + '</div>' +
      '</div>';
    }
  }).join("");

  viewer.innerHTML =
    '<div class="nb-tools">' +
      '<div class="nb-search-box">' +
        '<span class="search-icon">&#128269;</span>' +
        '<input type="text" id="nb-search" placeholder="搜索此 Notebook 中的代码与文字（按 / 快速聚焦，Esc 清空）...">' +
        '<span class="nb-search-count" id="nb-search-count"></span>' +
      '</div>' +
      '<div class="nb-tools-row">' +
        '<button class="nb-tools-btn" id="nb-expand-all">&#9650; 全部展开</button>' +
        '<button class="nb-tools-btn" id="nb-collapse-all">&#9660; 全部折叠</button>' +
      '</div>' +
      tocHtml +
    '</div>' +
    cellHtml;

  document.querySelector("#field-table").closest(".detail-section").style.display = "none";
  document.querySelector("#stats-summary").closest(".detail-section").style.display = "none";
  document.querySelector("#preview-table").closest(".detail-section").style.display = "none";

  viewer.querySelectorAll(".nb-cell[data-folded='1']").forEach(function (c) { c.classList.add("folded"); });

  var searchInput = document.getElementById("nb-search");
  if (searchInput) {
    searchInput.addEventListener("input", function () {
      var q = this.value.trim().toLowerCase();
      var all = viewer.querySelectorAll(".nb-cell");
      var countEl = document.getElementById("nb-search-count");
      var hits = 0;
      all.forEach(function (c) {
        if (!q) { c.style.display = ""; c.classList.remove("search-hit"); return; }
        var txt = c.getAttribute("data-search-text") || "";
        if (txt.indexOf(q) > -1) { c.style.display = ""; c.classList.add("search-hit"); hits++; }
        else { c.style.display = "none"; c.classList.remove("search-hit"); }
      });
      if (countEl) countEl.textContent = q ? (hits + " / " + all.length + " 个单元格命中") : "";
    });
  }

  renderRecentList();
  window.scrollTo(0, 0);
}

/* ---- 事件委托扩展：MD复制 / 移动 / 图片放大 / 导出HTML / 回顶 / 关闭lightbox ---- */
/* 捕获阶段优先处理复制按钮：代码块已带行号，必须取 .nb-code-hl 的纯代码文本，
   并用 stopPropagation 阻止旧版冒泡委托复制到带行号的文本 */
document.addEventListener("click", function (e) {
  var t = e.target, el;
  el = t.closest ? t.closest(".nb-copy-btn") : null;
  if (el) {
    e.stopPropagation();
    var cellEl = document.getElementById("nb-cell-" + el.dataset.copyCell);
    if (cellEl) {
      var codeEl = cellEl.querySelector(".nb-code-hl") || cellEl.querySelector(".nb-code-block");
      var text = codeEl ? codeEl.textContent : "";
      copyTextFallback(text, function () {
        el.textContent = "已复制 ✓";
        setTimeout(function () { el.textContent = "复制"; }, 1500);
      }, function () { alert("复制失败，请手动选择代码后复制"); });
    }
    return;
  }
  el = t.closest ? t.closest(".md-copy-btn") : null;
  if (el) {
    e.stopPropagation();
    var pre = el.closest(".md-pre") ? el.closest(".md-pre").querySelector("pre") : null;
    if (pre) {
      copyTextFallback(pre.textContent, function () {
        el.textContent = "已复制 ✓";
        setTimeout(function () { el.textContent = "复制"; }, 1500);
      }, function () { alert("复制失败，请手动复制"); });
    }
    return;
  }
}, true);

document.addEventListener("click", function (e) {
  var t = e.target, el;
  el = t.closest ? t.closest(".nb-move-btn") : null;
  if (el) {
    moveCell(parseInt(el.dataset.moveCell, 10), parseInt(el.dataset.moveDir, 10));
    return;
  }
  el = t.closest ? t.closest("#nb-export-html") : null;
  if (el) { exportNotebookHTML(); return; }
  el = t.closest ? t.closest(".nb-image-output img") : null;
  if (el) { openLightbox(el.src); return; }
  el = t.closest ? t.closest(".nb-lightbox-close") : null;
  if (el) { e.stopPropagation(); closeLightbox(); return; }
  el = t.closest ? t.closest("#nb-lightbox") : null;
  if (el) { closeLightbox(); return; }
  el = t.closest ? t.closest(".back-top-btn") : null;
  if (el) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  el = t.closest ? t.closest(".recent-chip") : null;
  if (el) {
    var list = [];
    try { list = JSON.parse(localStorage.getItem("dv_recent") || "[]"); } catch (e2) {}
    var item = list[parseInt(el.dataset.recent, 10)];
    if (item) {
      var saved = importedNotebooks.filter(function (n) { return n.filename === item.filename; });
      if (saved.length && saved[0].nbData) {
        renderNotebook(saved[0].nbData, saved[0].filename);
      } else {
        alert("该 Notebook 已不在已保存列表中，请重新导入");
      }
    }
    return;
  }
});

/* ---- 高级初始化扩展：进度条 / 回顶按钮 / 最近查看区 ---- */
function initAdvanced2() {
  /* 阅读进度条 */
  if (!document.getElementById("reading-bar")) {
    var bar = document.createElement("div");
    bar.className = "reading-bar";
    bar.innerHTML = '<div class="reading-bar-fill" id="reading-bar-fill"></div>';
    document.body.appendChild(bar);
  }
  var fill = document.getElementById("reading-bar-fill");
  var onScroll = function () {
    var st = document.documentElement.scrollTop || document.body.scrollTop;
    var h = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    if (fill) fill.style.width = (h > 0 ? (st / h * 100) : 0) + "%";
    var bt = document.getElementById("back-top-btn");
    if (bt) bt.classList.toggle("show", st > 300);
  };
  document.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  /* 回到顶部按钮 */
  if (!document.getElementById("back-top-btn")) {
    var bt = document.createElement("button");
    bt.id = "back-top-btn";
    bt.className = "back-top-btn";
    bt.innerHTML = "&#9650;";
    bt.setAttribute("title", "回到顶部");
    document.body.appendChild(bt);
  }

  /* 最近查看区（插在已保存区之前） */
  var savedSec = document.getElementById("saved-section");
  if (savedSec && !document.getElementById("recent-section")) {
    var rs = document.createElement("div");
    rs.id = "recent-section";
    rs.className = "recent-section";
    savedSec.parentNode.insertBefore(rs, savedSec);
  }
  renderRecentList();
}
document.addEventListener("DOMContentLoaded", function () {
  initAdvanced2();
});

/* ====== 首页"我的文件"（部署内嵌数据） ====== */
/* =====================================================
   部署内嵌数据槽位：
   把要发布到网页首页的文件填进 EMBEDDED_NOTEBOOKS 数组即可，
   格式与"导出全部备份"的 json 一致：
   [{ "filename": "甲状腺分析.ipynb", "nbData": { "cells":[...], "nbformat":4 } }, ...]
   留空数组 = 首页不显示"我的文件"板块。

\n","        'PR-AUC': average_precision_score(y_test, y_prob),\n","        '混淆矩阵': confusion_matrix(y_test, y_pred),\n","        '模型对象': model,\n","    }"]},{"cell_type":"code","execution_count":77,"id":"b6bdb7f5-2254-4a91-803d-379dd8a48561","metadata":{},"outputs":[],"source":["# 3.2 训练三个模型（class_weight='balanced' / 样本加权，缓解类别不平衡）\n","results = []\n","\n","# 逻辑回归：系数可直接解释为对肿瘤概率的影响方向\n","lr = LogisticRegression(max_iter=2000, class_weight='balanced', random_state=42)\n","results.append(evaluate_model('逻辑回归', lr, X_train, y_train, X_test, y_test))\n","\n","# 随机森林\n","rf = RandomForestClassifier(n_estimators=300, class_weight='balanced',\n","                            random_state=42, n_jobs=-1)\n","results.append(evaluate_model('随机森林', rf, X_train, y_train, X_test, y_test))\n","\n","# 梯度提升（无 class_weight 参数，改用样本加权平衡）\n","pos_w = (y_train == 0).sum() / max((y_train == 1).sum(), 1)\n","sample_weight = np.where(y_train == 1, pos_w, 1.0)\n","gb = GradientBoostingClassifier(random_state=42)\n","gb.fit(X_train, y_train, sample_weight=sample_weight)\n","y_pred_gb = gb.predict(X_test)\n","y_prob_gb = gb.predict_proba(X_test)[:, 1]\n","results.append({\n","    '模型': '梯度提升',\n","    '准确率': accuracy_score(y_test, y_pred_gb),\n","    '精确率': precision_score(y_test, y_pred_gb, zero_division=0),\n","    '召回率': recall_score(y_test, y_pred_gb),\n","    'F1': f1_score(y_test, y_pred_gb, zero_division=0),\n","    'ROC-AUC': roc_auc_score(y_test, y_prob_gb),\n","    'PR-AUC': average_precision_score(y_test, y_prob_gb),\n","    '混淆矩阵': confusion_matrix(y_test, y_pred_gb),\n","    '模型对象': gb,\n","})"]},{"cell_type":"code","execution_count":78,"id":"59217969-d1ed-4a3d-9127-b8ee8263896c","metadata":{},"outputs":[{"name":"stdout","output_type":"stream","text":["未安装 xgboost，已跳过（可选安装：pip install xgboost）\n"]}],"source":["# 3.3（可选）XGBoost：若已安装则加入对比\n","try:\n","    from xgboost import XGBClassifier\n","    xgb = XGBClassifier(eval_metric='logloss',\n","                        scale_pos_weight=(y_train == 0).sum() / max((y_train == 1).sum(), 1),\n","                        random_state=42, n_jobs=-1)\n","    results.append(evaluate_model('XGBoost', xgb, X_train, y_train, X_test, y_test))\n","    print(\"XGBoost 已加入对比\")\n","except ImportError:\n","    print(\"未安装 xgboost，已跳过（可选安装：pip install xgboost）\")"]},{"cell_type":"code","execution_count":79,"id":"83acfbbf-b501-4c20-a61e-8a3def523066","metadata":{},"outputs":[{"data":{"text/html":["<div>\n","<style scoped>\n","    .dataframe tbody tr th:only-of-type {\n","        vertical-align: middle;\n","    }\n","\n","    .dataframe tbody tr th {\n","        vertical-align: top;\n","    }\n","\n","    .dataframe thead th {\n","        text-align: right;\n","    }\n","<\/style>\n","<table border=\"1\" class=\"dataframe\">\n","  <thead>\n","    <tr style=\"text-align: right;\">\n","      <th><\/th>\n","      <th>模型<\/th>\n","      <th>准确率<\/th>\n","      <th>精确率<\/th>\n","      <th>召回率<\/th>\n","      <th>F1<\/th>\n","      <th>ROC-AUC<\/th>\n","      <th>PR-AUC<\/th>\n","    <\/tr>\n","  <\/thead>\n","  <tbody>\n","    <tr>\n","      <th>0<\/th>\n","      <td>逻辑回归<\/td>\n","      <td>0.9019<\/td>\n","      <td>0.0500<\/td>\n","      <td>0.1528<\/td>\n","      <td>0.0753<\/td>\n","      <td>0.5938<\/td>\n","      <td>0.0386<\/td>\n","    <\/tr>\n","    <tr>\n","      <th>1<\/th>\n","      <td>随机森林<\/td>\n","      <td>0.9026<\/td>\n","      <td>0.0505<\/td>\n","      <td>0.1528<\/td>\n","      <td>0.0759<\/td>\n","      <td>0.5920<\/td>\n","      <td>0.0424<\/td>\n","    <\/tr>\n","    <tr>\n","      <th>2<\/th>\n","      <td>梯度提升<\/td>\n","      <td>0.9019<\/td>\n","      <td>0.0500<\/td>\n","      <td>0.1528<\/td>\n","      <td>0.0753<\/td>\n","      <td>0.5931<\/td>\n","      <td>0.0421<\/td>\n","    <\/tr>\n","  <\/tbody>\n","<\/table>\n","<\/div>"],"text/plain":["     模型     准确率     精确率     召回率      F1  ROC-AUC  PR-AUC\n","0  逻辑回归  0.9019  0.0500  0.1528  0.0753   0.5938  0.0386\n","1  随机森林  0.9026  0.0505  0.1528  0.0759   0.5920  0.0424\n","2  梯度提升  0.9019  0.0500  0.1528  0.0753   0.5931  0.0421"]},"execution_count":79,"metadata":{},"output_type":"execute_result"}],"source":["# 3.4 模型结果对比表\n","summary = pd.DataFrame([{k: v for k, v in r.items() if k not in ('混淆矩阵', '模型对象')} for r in results])\n","summary.round(4)"]},{"cell_type":"code","execution_count":80,"id":"380bd511-497d-49a3-a339-9cf19ae2d37e","metadata":{},"outputs":[{"name":"stdout","output_type":"stream","text":["基线（全部预测为否）: 准确率 0.9738 | ROC-AUC 0.5（无区分能力）\n"]}],"source":["# 3.5 基线对比：全部预测为「否」时（证明模型比基线有区分能力）\n","base_acc = (y_test == 0).mean()\n","print(\"基线（全部预测为否）: 准确率 {:.4f} | ROC-AUC 0.5（无区分能力）\".format(base_acc))"]},{"cell_type":"code","execution_count":81,"id":"e51f1cec-0d98-41d5-84e9-fb3592a606b9","metadata":{},"outputs":[{"data":{"image/png":"iVBORw0KGgoAAAANSUhEUgAAArIAAAJOCAYAAABLKeTiAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjAsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvlHJYcgAAAAlwSFlzAAAPYQAAD2EBqD+naQAAtX1JREFUeJzs3Qd4U3UXBvC3K53sjSxBRNlbQQRBUJS9N4jsqeJgCCJbZQkyZe+9VVBUUFkyRZai7L03hY7ke94/pl8pq4W2We/veUKbNE1u7qXtybnnf46XzWazQURERETExXg7egNERERERB6HAlkRERERcUkKZEVERETEJSmQFRERERGXpEBWRERERFySAlkRERERcUkKZEVERETEJSmQFRERERGXpEBWRMSNREZGOnoTREQSjQJZEREnExoaioULF+Lo0aPmenh4OCZOnIh9+/Y98nubN2+Oxo0bw2q1Rt32zz//ICQkBJMmTTKPtWfPnifexvz585vHiy1u+5dffomwsLAnfm4RETsFsiIiTubq1auoU6cOtm3bFpVlbdWqFTZs2PDQ7zt79izmz5+P8uXLw9v7/7/e06ZNixs3biBNmjRYuXIlihcvjj/++OOJtvHMmTPmMWN6/vnn8dFHH91z+/bt2/Hee+/dFWCLiDwpBbIi4rHWrl0LLy+vqEvq1KlRrVo1/PXXX3fdb+nSpciTJw8CAgJQsGBBrFmz5q6vM8v44Ycfmu9Pnjw52rVrh1u3bj32dgUFBZmPfCzi85K/v/9Dv+/zzz9H6dKl8dZbb+HChQtRtydLlsx8DAwMRNWqVdG+ffuobG/01/Dpp5/iiy++wJAhQ6Iu48ePv+9z8bGiB8t23Fb79kbn5+cXq9cgIhIXCmRFxONNnz4dv//+O0aPHo39+/fj5ZdfxqVLl8x+YRa0du3aJoBdtmwZsmbNisqVK+PAgQNR+61Tp07mMcaMGWNOty9ZsgRdu3Z97P3KoDr6x9ieumf5wciRI01GN2fOnBg8ePBd97l+/Tq2bt1qvjZ79mxUqFAh6mvMlPK1M4i3X+bNm2deF0sdIiIi7vu8LFW4fft21HUfH5/7BrgWi8V8LfprOnHiBFq3bq1yAxF5fDYREQ+1Zs0aG38NbtmyJeq23bt3m9umTZtmrtesWdOWJ08em9VqNddv3bplS5s2 clidean', 'hamming'],  # hamming 对二值特征更合适\n","}\n","grid = GridSearchCV(KNeighborsClassifier(), param_grid, cv=5,\n","                    scoring='roc_auc', n_jobs=-1, verbose=1, return_train_score=True)\n","grid.fit(X_train, y_train)\n","\n","print(\"最佳参数:\", grid.best_params_)\n","print(\"5 折交叉验证 ROC-AUC: {:.4f}\".format(grid.best_score_))\n","results.append(evaluate_model('KNN(优化)', grid.best_estimator_, X_train, y_train, X_test, y_test))"]},{"cell_type":"code","execution_count":89,"id":"2170c05d-73fa-45df-adb0-2531d3eff4f0","metadata":{},"outputs":[{"data":{"image/png":"iVBORw0KGgoAAAANSUhEUgAAA3kAAAHpCAYAAAA/CfW/AAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjAsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvlHJYcgAAAAlwSFlzAAAPYQAAD2EBqD+naQAArp9JREFUeJzs3Qd4U9X7B/Bvulu6F4VS9i57yR6ypwouREQUfwgqIAKCyhQZgiwXKv4BFVHcoCwBEWXKHmXv3UH3bpL/8540pS1pm0LbtOn38zyX3uTeJDcnt+W+ec95j0av1+tBREREREREVsHG0gdAREREREREBYdBHhERERERkRVhkEdERERERGRFGOQRERERERFZEQZ5REREREREVoRBHhERERERkRVhkEdERERERGRFGOQRERERERFZEQZ5REREREREVoRBHhFRIXj//fdx8eLFjNtXr17FBx98gNu3b6vb0dHReT7Hjh07EBUVlXH7zJkzWLt2LT8vKhI//vgjqlSpgpCQkGLR4v/++y927dqF1NTUXPfbu3dvkR0TEVFxpdHr9XpLHwQRkTW5fv06KlSogDfffBNz5sxR9x09ehQNGzbE8ePHYWNjgzZt2qiL1rp165p8DvnTXLVqVdSuXRsbNmxQ9y1evFg9382bN4v0/VDpdOjQITRp0gSvvfYalixZkuu+4eHh6osMBwcHdX5rNJpc97e1tUWNGjUybt+5c0ed1y4uLhmPLVOmDPz8/DL2CQ4OxqlTp9QXJb6+viaf9/fff8djjz2G9evXo2vXroiLi8Pp06dhb2+vji07CRhTUlLU76adnV2ebUJEVGJIkEdEVJL99ddf8mWV/tChQxn3zZw5U6/RaPQbN27UX7x4UW0fOHBglsdVqlRJP2TIkIz1oKAgfVpaWsZ22Sb359eSJUv0zs7O+oiIiIz7Tp48qY7hypUr6nbPnj319evX1ycmJpp8jl9++UUdf0hISMZ9n376qT4wMDDLfpcvX9YnJyfrrdXUqVP1HTp0KPDHLV++XF+mTJkHPDrroNVq9bGxsSa3DRgwQD99+nSTj4mKisq4vWLFCnXOOzo66m1sbPQ+Pj45LnJet23bNsvzyePt7e317u7ueg8PD72Dg4P+lVdeydj+999/q+fv1auX/u233871/Tz55JN6T09P/blz5/R79uzR29nZqc/a29tbPb/8HhqPxdXVVW9ra6sPCwszq63k74E8XhZ5rw0bNtR//fXXWfa5du2avl+/fnoXFxd92bJl9e+8845qr8zWrVunDw4OVs/RqlUr/ZEjR/T5JX+r5H0OHTo0y/3Gv3fyNySzpk2bZvy9E9HR0eqx0iZ+fn4mj5OISi521yQiq/Pff/9h2rRpGDduHLp3755x/08//ZTRXdIUyUT89ttvD/TaOp1 function renderEmbeddedNotebooks() {
  var sec = document.getElementById("embedded-section");
  if (!sec) return;
  var list = (typeof EMBEDDED_NOTEBOOKS !== "undefined") ? EMBEDDED_NOTEBOOKS : [];
  if (!list.length) {
    sec.style.display = "none";
    return;
  }
  sec.style.display = "";
  var countEl = document.getElementById("embedded-count");
  if (countEl) countEl.textContent = list.length + " 个文件";
  var grid = document.getElementById("embedded-grid");
  if (!grid) return;
  grid.innerHTML = list.map(function (item, i) {
    var nb = item.nbData || {};
    var cells = (nb.cells || []).length;
    var codeCells = (nb.cells || []).filter(function (c) { return c.cell_type === "code"; }).length;
    var mdCells = (nb.cells || []).filter(function (c) { return c.cell_type === "markdown"; }).length;
    return '<div class="myfile-card" data-embedded="' + i + '" title="点击查看：' + escHtml(item.filename) + '">' +
      '<div class="myfile-badge">内置文件</div>' +
      '<div class="myfile-icon">&#128194;</div>' +
      '<div class="myfile-name">' + escHtml(item.filename) + '</div>' +
      '<div class="myfile-meta">' +
        '<span>&#128196; ' + cells + ' 个单元格</span>' +
        '<span>&#128187; ' + codeCells + ' 个代码</span>' +
        (mdCells ? '<span>&#128221; ' + mdCells + ' 个文字</span>' : '') +
      '</div>' +
    '</div>';
  }).join("");
}

document.addEventListener("click", function (e) {
  var el = e.target.closest ? e.target.closest(".myfile-card") : null;
  if (!el) return;
  var i = parseInt(el.dataset.embedded, 10);
  var list = (typeof EMBEDDED_NOTEBOOKS !== "undefined") ? EMBEDDED_NOTEBOOKS : [];
  if (list[i] && list[i].nbData) {
    renderNotebook(list[i].nbData, list[i].filename);
  }
});

function initEmbedded() {
  var sec = document.getElementById("embedded-section");
  if (sec) renderEmbeddedNotebooks();
}
document.addEventListener("DOMContentLoaded", function () {
  initEmbedded();
});
